<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuadPlot</title>
  </head>
  <body class="bg-slate-900 text-slate-100 font-sans overflow-hidden select-none">
    <div id="app">
      <!-- Alpine Root Component -->
      <div x-data="quadPlot" 
           x-ref="container"
           @dblclick="handleDblClick" 
           class="relative w-screen h-screen">
           
        <!-- Tab Bar -->
        <div class="absolute top-4 left-[calc(50%+16px)] flex items-center p-1 bg-slate-800/80 backdrop-blur border border-slate-700/50 rounded-xl z-40 pointer-events-auto shadow-xl">
          <template x-for="tab in tabs" :key="tab.id">
            <button type="button" @click="switchTab(tab.id)" @dblclick="editTabName(tab.id)"
                    :class="{'bg-slate-700 text-cyan-400 shadow-sm': activeTabId === tab.id, 'text-slate-400 hover:text-slate-200 hover:bg-slate-700/50': activeTabId !== tab.id}"
                    class="px-4 py-1.5 mx-0.5 rounded-lg text-sm font-bold transition-all"
                    x-text="tab.name"></button>
          </template>
          <div class="w-px h-5 bg-slate-700 mx-1"></div>
          <button type="button" @click="addTab()" 
                  class="p-1.5 mx-0.5 text-slate-400 hover:text-cyan-400 hover:bg-slate-700/50 rounded-lg transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <title>新しいマップ</title>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
          </button>
        </div>
           
        <!-- X Axis -->
        <div class="absolute top-1/2 left-0 w-full h-[2px] bg-slate-600/50 -translate-y-1/2 pointer-events-none flex items-center justify-between px-4 text-xs text-slate-400 font-medium">
          <span class="pointer-events-auto cursor-pointer hover:text-cyan-400 px-2 py-1" @dblclick.stop="editLabel('xNegative')" x-text="activeTab.labels.xNegative"></span>
          <span class="pointer-events-auto cursor-pointer hover:text-cyan-400 px-2 py-1" @dblclick.stop="editLabel('xPositive')" x-text="activeTab.labels.xPositive"></span>
        </div>

        <!-- Y Axis -->
        <div class="absolute left-1/2 top-0 h-full w-[2px] bg-slate-600/50 -translate-x-1/2 pointer-events-none flex flex-col items-center justify-between py-4 text-xs text-slate-400 font-medium">
          <span class="pointer-events-auto cursor-pointer hover:text-cyan-400 px-2 py-1" @dblclick.stop="editLabel('yPositive')" x-text="activeTab.labels.yPositive"></span>
          <span class="pointer-events-auto cursor-pointer hover:text-cyan-400 px-2 py-1" @dblclick.stop="editLabel('yNegative')" x-text="activeTab.labels.yNegative"></span>
        </div>

        <!-- Quadrant Labels -->
        <div class="absolute top-8 left-8 text-slate-500/50 font-bold text-2xl md:text-4xl cursor-pointer hover:text-cyan-400/80 transition-colors pointer-events-auto" @dblclick.stop="editLabel('qTopLeft')" x-text="activeTab.labels.qTopLeft"></div>
        <div class="absolute top-8 right-8 text-slate-500/50 font-bold text-2xl md:text-4xl cursor-pointer hover:text-cyan-400/80 transition-colors pointer-events-auto" @dblclick.stop="editLabel('qTopRight')" x-text="activeTab.labels.qTopRight"></div>
        <div class="absolute bottom-8 left-8 text-slate-500/50 font-bold text-2xl md:text-4xl cursor-pointer hover:text-cyan-400/80 transition-colors pointer-events-auto" @dblclick.stop="editLabel('qBottomLeft')" x-text="activeTab.labels.qBottomLeft"></div>
        <div class="absolute bottom-8 right-8 text-slate-500/50 font-bold text-2xl md:text-4xl cursor-pointer hover:text-cyan-400/80 transition-colors pointer-events-auto" @dblclick.stop="editLabel('qBottomRight')" x-text="activeTab.labels.qBottomRight"></div>

        
        <!-- Items -->
        <template x-for="item in activeTab.items" :key="item.id">
          <div class="absolute flex flex-col items-center cursor-grab active:cursor-grabbing group"
               :style="`left: ${item.x}px; top: ${item.y}px; transform: translate(-50%, -50%);`"
               @mousedown.prevent="startDrag($event, item.id)"
               @dblclick.stop="openItemDialog(item)">
               
            <!-- Dot -->
            <div class="w-4 h-4 rounded-full bg-cyan-400 shadow-[0_0_12px_rgba(34,211,238,0.8)] border-2 border-slate-900 transition-transform group-hover:scale-125"></div>
            
            <!-- Label -->
            <div class="mt-2 px-3 py-1 bg-slate-800/80 rounded-md text-sm font-semibold border border-slate-700 whitespace-nowrap shadow-xl backdrop-blur-md text-cyan-50"
                 x-text="item.text"></div>
          </div>
        </template>

        <!-- Data Import / Export Buttons -->
        <div class="absolute bottom-8 right-[calc(50%+16px)] flex items-center space-x-2 p-1 bg-slate-800/80 backdrop-blur border border-slate-700/50 rounded-xl z-40 pointer-events-auto shadow-xl">
          <button type="button" @click="exportData()" 
                  class="flex items-center space-x-1 px-3 py-1.5 text-slate-400 hover:text-cyan-400 hover:bg-slate-700/50 rounded-lg text-sm font-bold transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <title>エクスポート</title>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            <span>エクスポート</span>
          </button>
          <div class="w-px h-5 bg-slate-700"></div>
          <button type="button" @click="$refs.fileInput.click()" 
                  class="flex items-center space-x-1 px-3 py-1.5 text-slate-400 hover:text-cyan-400 hover:bg-slate-700/50 rounded-lg text-sm font-bold transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <title>インポート</title>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
            </svg>
            <span>インポート</span>
          </button>
          <input type="file" x-ref="fileInput" @change="importData" accept=".json" class="hidden">
        </div>

        <!-- Overlay Instruction -->
        <div class="absolute bottom-8 left-[calc(50%+16px)] px-6 py-3 bg-slate-800/60 rounded-full text-slate-300 text-sm backdrop-blur border border-slate-700/50 shadow-2xl pointer-events-none animate-pulse">
          任意の場所をダブルクリックしてアイテムを追加
        </div>

        <!-- Item Edit Modal -->
        <div x-show="editingItem !== null" 
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100"
             x-cloak
             class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm">
          
          <div class="bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6"
               @click.away="closeItemDialog()">
            
            <div class="flex items-center justify-between">
              <h3 class="text-xl font-bold text-slate-100" x-text="editingItem?.isNew ? 'アイテムの追加' : 'アイテムの編集'"></h3>
              <button type="button" @click="closeItemDialog()" class="text-slate-400 hover:text-slate-100 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <title>閉じる</title>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
              </button>
            </div>

            <template x-if="editingItem">
              <div class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">名前</label>
                  <input type="text" x-model="editingItem.text" 
                         class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all">
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">メモ</label>
                  <textarea x-model="editingItem.memo" rows="4"
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all placeholder:text-slate-600"
                            placeholder="気づきや補足情報を入力..."></textarea>
                </div>
              </div>
            </template>

            <div class="flex items-center justify-between pt-4">
              <button type="button" @click="deleteItem()" x-show="!editingItem?.isNew"
                      class="px-4 py-2 text-red-400 hover:bg-red-500/10 rounded-lg transition-colors font-medium">
                削除する
              </button>
              <div class="flex space-x-3">
                <button type="button" @click="closeItemDialog()" 
                        class="px-4 py-2 text-slate-300 hover:text-slate-100 transition-colors">
                  キャンセル
                </button>
                <button type="button" @click="saveItemDialog()" 
                        class="px-6 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg font-bold shadow-lg shadow-cyan-900/20 transition-all">
                  保存
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
